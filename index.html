<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DISCO DOODLE - draw yourself, hit the dance floor</title>
<meta name="description" content="Draw a little dancer and drop them onto a 90s disco floor. 画个小人，丢进 90 年代舞池。">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="floor"></canvas>

<div id="hud" hidden>
  <div class="logo"><span data-i18n="logoMain">DISCO DOODLE</span><small data-i18n="logoSub">DRAW · DANCE · SHOUT</small></div>
  <a class="homeLink" href="https://yuwensu.com" target="_blank" rel="noopener" data-i18n="home">Yuwen's homepage ↗</a>
  <div class="stats" id="stat"></div>
  <button class="langBtn hudLang" data-i18n="langBtn">中文</button>
  <div id="findBox" hidden>
    <input id="findIn" data-i18n-ph="findPh" placeholder="Type a name…" maxlength="16" autocomplete="off">
    <div id="findRes"></div>
  </div>
  <div class="bar">
    <button id="bMusic" class="neon">🔇 Music</button>
    <button id="bNext" class="neon" hidden data-i18n="next">⏭ Next</button>
    <button id="bMe" class="neon" data-i18n="me">📍 Find me</button>
    <button id="bFind" class="neon" data-i18n="find">🔍 Search</button>
    <button id="bScreen" class="neon" data-i18n="screen">📺 Big screen</button>
    <button id="bDraw" class="neon hot">✏️ Draw me</button>
  </div>
</div>

<div id="editor" class="veil" hidden>
  <div class="win">
    <div class="title"><span data-i18n="winTitle">🕺 my_dancer.bmp - Disco Paint</span><span class="tb"><i>_</i><i>□</i><i id="edClose">×</i></span></div>
    <div class="menu">
      <span data-i18n="mFile">File</span><span data-i18n="mEdit">Edit</span><span data-i18n="mDisco">Disco</span>
      <span class="tip" data-i18n="tip">Doodle on the mannequin: a new outfit, a slogan, a hat… anything goes</span>
      <span class="grow"></span>
      <button class="langBtn mbtn" data-i18n="langBtn">中文</button>
      <a class="mlink" href="https://yuwensu.com" target="_blank" rel="noopener" data-i18n="home">Yuwen's homepage ↗</a>
    </div>
    <div class="body">
      <div class="tools">
        <div id="tools" class="toolgrid"></div>
        <div id="sizes" class="sizes"></div>
        <button id="bUndo" class="w95" data-i18n="undo">↶ Undo</button>
        <button id="bClear" class="w95" data-i18n="clear">🗑 Clear</button>
        <label class="chk"><input type="checkbox" id="showBase" checked> <span data-i18n="base">Body</span></label>
      </div>
      <div class="paperWrap">
        <div id="paper"><canvas id="base" width="128" height="192"></canvas><canvas id="ink" width="128" height="192"></canvas></div>
      </div>
      <div class="side">
        <div class="pv"><canvas id="preview" width="150" height="216"></canvas><div class="cap" data-i18n="pvCap">▲ LIVE PREVIEW</div></div>
        <div class="lbl" data-i18n="pickMove">Pick a move</div>
        <div id="moves" class="moves"></div>
        <div class="lbl" data-i18n="nick">Nickname</div>
        <input id="name" class="w95in" maxlength="16" data-i18n-ph="anon" placeholder="Anonymous dancer" autocomplete="off">
        <div class="lbl" data-i18n="msg">Leave a line</div>
        <input id="msg" class="w95in" maxlength="40" data-i18n-ph="msgPh" placeholder="Confess, find someone, shout" autocomplete="off">
      </div>
    </div>
    <div class="palrow">
      <div id="cur" class="cur"></div>
      <div id="palette" class="palette"></div>
    </div>
    <div class="foot">
      <button id="bWatch" class="w95" data-i18n="watch">Just watch</button>
      <button id="bGo" class="w95 go">Hit the floor ▶</button>
    </div>
  </div>
</div>

<div id="zoom" class="veil" hidden>
  <div class="card">
    <button class="x" id="zClose">×</button>
    <canvas id="zCanvas" width="420" height="640"></canvas>
    <div class="zinfo">
      <div class="zname" id="zName"></div>
      <div class="zmsg" id="zMsg"></div>
      <div class="zmeta" id="zMeta"></div>
      <div class="zbtns" id="zBtns"></div>
    </div>
  </div>
</div>

<div id="screenDlg" class="veil" hidden>
  <div class="card small">
    <button class="x" id="sClose">×</button>
    <div class="shead" data-i18n="sHead">📺 Get on the big screen</div>
    <div class="ssub" id="sSub"></div>
    <textarea id="sText" maxlength="40" rows="3" data-i18n-ph="sPh"></textarea>
    <label class="chk lite" id="sWithWrap"><input type="checkbox" id="sWith" checked> <span data-i18n="sWith">Put my dancer on screen too</span></label>
    <button id="sGo" class="neon hot big" data-i18n="sGo">GO BIG!</button>
  </div>
</div>

<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/rig.js"></script>
<script src="js/audio.js"></script>
<script src="js/floor.js"></script>
<script src="js/editor.js"></script>
<script src="js/main.js"></script>
</body>
</html>
